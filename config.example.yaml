version: 1
audit:
  path: /tmp/ops-lens-demo-audit.jsonl
redaction:
  identityKeys: [userId, playerId, sessionId]
  identityLabels: [user, player, session, room]
  identityValues: []
limits:
  maxWindowMinutes: 60
  maxRows: 1000
  maxOutputBytes: 65536
  maxConcurrentProviderCalls: 2
  maxResponseBytes: 2000000
  maxLokiScanBytes: 5000000
  timeoutMs: 20000
providers:
  grafana:
    enabled: false
    baseUrl: https://grafana.example.invalid
    tokenEnv: OPS_LENS_GRAFANA_TOKEN
    prometheusUid: demo-prometheus
    lokiUid: demo-loki
  uptime:
    enabled: false
    baseUrl: https://status.example.invalid
    slug: demo
writes:
  enabled: false
  demoOnly: true
  containers: []
