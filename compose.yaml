name: ops-lens-demo
services:
  demo-api:
    build: ./demo/api
    environment:
      LOKI_URL: http://loki:3100
    ports:
      - 127.0.0.1:8088:8080
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      - loki
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./demo/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:9090:9090
    depends_on:
      - demo-api
  loki:
    image: grafana/loki:3.7.4
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./demo/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - 127.0.0.1:3100:3100
  grafana:
    image: grafana/grafana:13.1.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./demo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./demo/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - prometheus
      - loki
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    ports:
      - 127.0.0.1:3001:3001
    volumes:
      - uptime-data:/app/data
volumes:
  uptime-data:
